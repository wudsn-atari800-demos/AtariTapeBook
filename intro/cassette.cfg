MEMORY {
    MAIN: file = %O, start = $2000, size = $6000;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start;
}
SEGMENTS {
    FONT:   load = MAIN, type = ro, align = $400;
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA:   load = MAIN, type = rw;
}
